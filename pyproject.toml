[project]
name = "policy-orchestrator"
version = "0.1.0"
description = "Control plane for multi-repo policy enforcement, agent contracts, secrets hygiene, and cross-repo coordination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "qdrant-client>=1.17,<1.18",
    "httpx>=0.27",
    "cryptography>=47.0.0",
    "docvec",
    "sentence-transformers>=3.3",
    "psycopg2-binary>=2.9.12",
    "lz4>=4.4.5",
]

[tool.uv.sources]
docvec = { path = "../docvec" }

[project.scripts]
devctl = "policy_orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
