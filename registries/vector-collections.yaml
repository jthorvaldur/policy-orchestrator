    quantization: none
    chunk_max_chars: 1500
    chunk_overlap_chars: 200
    source_conversations: 132
    source_lines: 48843
    points_expected: 2000
    coverage_pct: 100
    data_sources:
    - name: Claude.ai web conversations (132 convos)
